#OpenAPI swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Observability
# Expose specific actuator endpoints via HTTP (health, info, metrics, and Prometheus)
management.endpoints.web.exposure.include=health, info, metrics, prometheus

# Enable histogram buckets for HTTP server request metrics (required for latency percentiles)
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Attach a custom key-value (tag) to all observations and metrics (e.g., "application=product-service")
management.observations.key-values.application=product-service

# Set tracing sampling rate to 100% (i.e., trace every request, useful in dev or testing)
management.tracing.sampling.probability=1.0

# Enable Tomcat's MBean registry for collecting detailed JVM and server stats
server.tomcat.mbeanregistry.enabled=true