#Application
spring.application.name=db_performance

#Database
spring.datasource.url=jdbc:mysql://localhost:3307/e_commerce
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=8088

#db
# Automatically create database tables based on JPA entities.
# 'create' drops and recreates tables on each app start (good for dev, not prod).
# Use 'update' to apply changes without dropping existing data.
spring.jpa.hibernate.ddl-auto=create

# Show the generated SQL statements in the console/logs (helpful for debugging).
spring.jpa.show-sql=true

# Format the SQL output to be more readable with proper indentation.
spring.jpa.properties.hibernate.format_sql=true


spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG
## Enable SQL query logging in console
logging.level.org.hibernate.SQL=DEBUG





